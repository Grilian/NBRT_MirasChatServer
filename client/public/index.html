<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <!--
      viewport-fit=cover нужен ярлыку на iPhone: в режиме «с рабочего стола»
      страница занимает весь экран, включая области под «чёлкой» и полосой
      жестов, и без него по краям остаются серые поля.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1a472a" />
    <meta
      name="description"
      content="MirasChat — внутренняя переписка сотрудников МИРАС"
    />

    <!--
      Ярлык на рабочем столе iPhone.

      Safari не поддерживает ни установку по кнопке, ни событие
      beforeinstallprompt: ярлык человек добавляет сам через «Поделиться → На
      экран «Домой»». Управлять оттуда можно только этими метками, и без них
      ярлык открывался бы обычной вкладкой Safari с адресной строкой поверх
      переписки. apple-touch-icon уже был, остальное добавлено.
    -->
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Тёмная полоса статуса под цвет шапки, а не белая поверх неё. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Подпись под значком: длинное имя iOS обрежет, поэтому короткое. -->
    <meta name="apple-mobile-web-app-title" content="MirasChat" />

    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>MirasChat</title>
  </head>
  <body>
    <noscript>Для работы приложения нужен включённый JavaScript.</noscript>
    <div id="root"></div>
  </body>
</html>
